[package]
name = "puyo2-ps2-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Source verification and disc survey tools for the PS2 Puyo Puyo Tsuu Korean patch"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
expected-write = { git = "https://github.com/mcpads/retro-typed-isa", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }
fontdue = "0.9"
object = { version = "0.37", default-features = false, features = ["read"] }
png = "0.18"
r5900 = { git = "https://github.com/mcpads/retro-typed-isa", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
typed-isa-core = { git = "https://github.com/mcpads/retro-typed-isa", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }

# The primary `cargo run --locked` path performs deterministic CPX search, font
# rendering, PNG encoding, and sector integrity generation. Keep debug symbols,
# but do not run those product algorithms at opt-level 0.
[profile.dev]
opt-level = 2

# Full-disc source and output identities remain part of the normal workflow.
[profile.dev.package.sha2]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
